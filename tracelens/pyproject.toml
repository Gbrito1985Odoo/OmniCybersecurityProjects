[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tracelens"
version = "0.1.0"
description = "Analizador inteligente de trazas con IA local: ingesta, etiquetado, filtrado, informes y chat RAG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TraceLens Team" }]
keywords = ["traces", "logs", "observability", "llm", "ollama", "chromadb", "rag"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0.0",
    "chromadb>=1.0.0",
    "ollama>=0.4.0",
    "typer>=0.12.0",
    "jinja2>=3.1.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "aiofiles>=24.0.0",
    "loguru>=0.7.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "requests>=2.31.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.black]
line-length = 100
