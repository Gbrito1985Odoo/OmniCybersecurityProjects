services:
  tracelens:
    build: .
    container_name: tracelens
    ports:
      - "8000:8000"
    volumes:
      - ${TRACELENS_DATA_DIR:-./data}:/app/data
    depends_on:
      - ollama
    # Variables de entorno según .env.example (TRACELENS_*)

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
